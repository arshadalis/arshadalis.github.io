<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cricket Stats Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0e1a;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);--tx:#eef0ff;--mu:#8b90b0;--or:#ff8a1f;--pu:#a855f7;--gr:#22d3a0;--bl:#38bdf8;--rd:#fb7185}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
background-image:radial-gradient(900px 500px at 10% -10%,rgba(255,138,31,.16),transparent),radial-gradient(900px 500px at 95% 0,rgba(168,85,247,.18),transparent),radial-gradient(700px 500px at 50% 110%,rgba(56,189,248,.10),transparent);background-attachment:fixed}
.wrap{max-width:1250px;margin:auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:24px}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.03em}
h1 span{background:linear-gradient(90deg,var(--or),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}
.cap{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:24px}
.cap::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c),transparent 65%);opacity:.22}
.cap>*{position:relative}
.cap .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--c);box-shadow:0 0 40px var(--c);flex:none}
.cap .lb{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--c);font-weight:700}
.cap .nm{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.cap .big{font-size:15px;color:var(--mu)}.cap .big b{font-size:26px;color:var(--tx);margin-right:4px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}.kpi .v{font-size:28px;font-weight:800}.kpi .l{font-size:12px;color:var(--mu);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-bottom:18px}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:900px){.s4,.s6,.s8{grid-column:span 12}}
h2{font-size:15px;font-weight:700;margin-bottom:14px}h2 small{color:var(--mu);font-weight:500;margin-left:6px}
.ch{position:relative;height:290px}.ch.tall{height:380px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:10px 12px;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;border-bottom:1px solid var(--bd)}
th.on{color:var(--or)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.05)}tbody tr:hover{background:rgba(255,255,255,.04)}
td.n{font-weight:600}.rk{color:var(--mu);width:30px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--bd);background:transparent;color:var(--mu);padding:7px 14px;border-radius:99px;font:600 13px Inter;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--or),var(--pu));color:#fff;border-color:transparent}
.m{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.m:last-child{border:0}.m .d{font-size:12px;color:var(--mu)}.m .sc{font-size:13px;color:var(--mu);margin-top:2px}
.win{font-weight:700;color:var(--gr);font-size:13px}
.err{padding:40px;text-align:center;color:var(--rd)}
</style></head><body>
<div class="wrap" id="app"><div class="sub">Loading stats…</div></div>
<script>
const $=s=>document.querySelector(s);
const C={or:'#ff8a1f',pu:'#a855f7',gr:'#22d3a0',bl:'#38bdf8',rd:'#fb7185',ye:'#fbbf24'};
Chart.defaults.color='#8b90b0';Chart.defaults.font.family='Inter';Chart.defaults.borderColor='rgba(255,255,255,.07)';
Chart.defaults.plugins.legend.labels.usePointStyle=true;Chart.defaults.maintainAspectRatio=false;
const f=(n,d=2)=>Number.isFinite(n)?n.toFixed(d):'–';
const ov=b=>Math.floor(b/6)+'.'+b%6;
const fmtD=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const charts=[];
function chart(id,cfg){charts.push(new Chart(document.getElementById(id),cfg))}

fetch('data.json?v='+Date.now()).then(r=>r.json()).then(render).catch(e=>{$('#app').innerHTML='<div class="err">Could not load data.json — '+e.message+'<br><small>Serve via GitHub Pages or a local server (python3 -m http.server).</small></div>'});

function render(D){
const name={};D.players.forEach(p=>name[p.id]=p.name);
const matches=D.matches.filter(m=>m.status==='COMPLETED').sort((a,b)=>a.date-b.date);
const mid=new Set(matches.map(m=>m.id));
const inn=D.innings.filter(i=>mid.has(i.matchId));
const P=D.careerStats.map(s=>{
 const dis=s.battingInnings-s.notOuts,ov_=s.legalBallsBowled/6;
 return {...s,name:name[s.playerId]||'Unknown',
  avg:dis>0?s.runsScored/dis:(s.runsScored>0?Infinity:NaN),
  sr:s.ballsFaced?s.runsScored/s.ballsFaced*100:NaN,
  bnd:s.fours*4+s.sixes*6,
  econ:s.legalBallsBowled?s.runsConceded/ov_:NaN,
  bavg:s.wicketsTaken?s.runsConceded/s.wicketsTaken:NaN,
  bsr:s.wicketsTaken?s.legalBallsBowled/s.wicketsTaken:NaN,
  best:s.wicketsTaken?s.bestBowlingWickets+'/'+s.bestBowlingRuns:'–',
  field:s.catches+s.runOuts+s.stumpings};
});
// Caps
const bat=P.filter(p=>p.runsScored>0).sort((a,b)=>b.runsScored-a.runsScored||b.sr-a.sr);
const bowl=P.filter(p=>p.wicketsTaken>0).sort((a,b)=>b.wicketsTaken-a.wicketsTaken||a.econ-b.econ);
const oc=bat[0],pc=bowl[0];
const tot=(k)=>P.reduce((a,p)=>a+p[k],0);
const teamWins={};matches.forEach(m=>{if(m.winningTeam)teamWins[m.winningTeam]=(teamWins[m.winningTeam]||0)+1});
const totRuns=inn.reduce((a,i)=>a+i.totalRuns,0),totBalls=inn.reduce((a,i)=>a+i.legalBallsBowled,0);
const hi=inn.slice().sort((a,b)=>b.totalRuns-a.totalRuns)[0];
const scoreOf=(m,n)=>{const i=inn.find(x=>x.matchId===m.id&&x.inningsNumber===n);return i?{t:i.battingTeam,txt:`${i.totalRuns}/${i.wickets} (${ov(i.legalBallsBowled)})`,r:i.totalRuns}:null};

$('#app').innerHTML=`
<header><div><h1>🏏 <span>${D.groupName||'Cricket'}</span> Stats</h1>
<div class="sub">${matches.length} matches · ${P.length} players · Updated ${fmtD(D.exportTimestamp)}</div></div></header>
<div class="caps">
 <div class="card cap" style="--c:var(--or)"><div class="ic">🧢</div><div>
  <div class="lb">Orange Cap · Most Runs</div>
  <div class="nm">${oc?oc.name:'—'}</div>
  ${oc?`<div class="big"><b>${oc.runsScored}</b>runs</div>
  <div class="pills"><span class="pill">SR ${f(oc.sr,1)}</span><span class="pill">Avg ${f(oc.avg,1)}</span><span class="pill">HS ${oc.highestScore}</span><span class="pill">${oc.fours}×4 · ${oc.sixes}×6</span></div>`:''}</div></div>
 <div class="card cap" style="--c:var(--pu)"><div class="ic">🧢</div><div>
  <div class="lb">Purple Cap · Most Wickets</div>
  <div class="nm">${pc?pc.name:'—'}</div>
  ${pc?`<div class="big"><b>${pc.wicketsTaken}</b>wickets</div>
  <div class="pills"><span class="pill">Econ ${f(pc.econ)}</span><span class="pill">Best ${pc.best}</span><span class="pill">Avg ${f(pc.bavg,1)}</span><span class="pill">${ov(pc.legalBallsBowled)} ov</span></div>`:''}</div></div>
</div>
<div class="kpis">
 ${[['Matches',matches.length],['Total Runs',totRuns],['Wickets',tot('wicketsTaken')],['Sixes',tot('sixes')],['Fours',tot('fours')],['Catches',tot('catches')],['Run Rate',f(totBalls?totRuns/(totBalls/6):NaN)],['Highest Total',hi?hi.totalRuns+'/'+hi.wickets:'–']].map(([l,v])=>`<div class="card kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}
</div>
<div class="grid">
 <div class="card s8"><h2>Match Scores <small>runs per innings</small></h2><div class="ch"><canvas id="cMatch"></canvas></div></div>
 <div class="card s4"><h2>Team Wins</h2><div class="ch"><canvas id="cWins"></canvas></div></div>
 <div class="card s6"><h2>Top Run Scorers</h2><div class="ch tall"><canvas id="cRuns"></canvas></div></div>
 <div class="card s6"><h2>Top Wicket Takers</h2><div class="ch tall"><canvas id="cWkts"></canvas></div></div>
 <div class="card s6"><h2>Strike Rate vs Average <small>bubble = runs</small></h2><div class="ch tall"><canvas id="cScat"></canvas></div></div>
 <div class="card s6"><h2>Boundaries <small>fours & sixes</small></h2><div class="ch tall"><canvas id="cBnd"></canvas></div></div>
 <div class="card s6"><h2>Bowling Economy <small>lower is better · min 1 over</small></h2><div class="ch tall"><canvas id="cEcon"></canvas></div></div>
 <div class="card s6"><h2>Fielding <small>catches, run-outs, stumpings</small></h2><div class="ch tall"><canvas id="cFld"></canvas></div></div>
 <div class="card s12"><h2>Top Performers Radar <small>top 5 run scorers · normalised</small></h2><div class="ch tall"><canvas id="cRad"></canvas></div></div>
</div>
<div class="card s12" style="margin-bottom:18px">
 <div class="tabs"><button class="tab on" data-t="bat">Batting</button><button class="tab" data-t="bowl">Bowling</button><button class="tab" data-t="fld">Fielding</button></div>
 <div class="tw"><table id="tbl"></table></div>
</div>
<div class="card"><h2>Match Results</h2>${matches.slice().reverse().map(m=>{const a=scoreOf(m,1),b=scoreOf(m,2);
 return `<div class="m"><div><div><b>${m.teamAName}</b> vs <b>${m.teamBName}</b></div><div class="sc">${[a,b].filter(Boolean).map(x=>x.t+' '+x.txt).join(' · ')}</div></div>
 <div style="text-align:right"><div class="win">${m.resultSummary||'—'}</div><div class="d">${fmtD(m.date)} · ${m.oversLimit} overs</div></div></div>`}).join('')}</div>`;

// Charts
const lbl=matches.map((m,i)=>'M'+(i+1));
const mk=(n)=>matches.map(m=>{const s=scoreOf(m,n);return s?s.r:0});
chart('cMatch',{type:'bar',data:{labels:lbl,datasets:[{label:'1st innings',data:mk(1),backgroundColor:C.or,borderRadius:8},{label:'2nd innings',data:mk(2),backgroundColor:C.pu,borderRadius:8}]},options:{plugins:{tooltip:{callbacks:{afterLabel:c=>{const m=matches[c.dataIndex];const s=scoreOf(m,c.datasetIndex+1);return s?s.t+' '+s.txt:''},footer:c=>matches[c[0].dataIndex].resultSummary}}}}});
const wk=Object.keys(teamWins);
chart('cWins',{type:'doughnut',data:{labels:wk,datasets:[{data:wk.map(k=>teamWins[k]),backgroundColor:[C.or,C.pu,C.bl,C.gr,C.rd],borderWidth:0}]},options:{cutout:'68%',plugins:{legend:{position:'bottom'}}}});
const hbar=(id,arr,key,color,extra={})=>chart(id,{type:'bar',data:{labels:arr.map(p=>p.name),datasets:[{data:arr.map(p=>p[key]),backgroundColor:color,borderRadius:8}]},options:{indexAxis:'y',plugins:{legend:{display:false}},...extra}});
hbar('cRuns',bat.slice(0,10),'runsScored',C.or);
hbar('cWkts',bowl.slice(0,10),'wicketsTaken',C.pu);
const sc=bat.filter(p=>Number.isFinite(p.avg)&&p.ballsFaced>0);
chart('cScat',{type:'bubble',data:{datasets:[{data:sc.map(p=>({x:p.sr,y:p.avg,r:4+Math.sqrt(p.runsScored)*.9,n:p.name,rn:p.runsScored})),backgroundColor:'rgba(255,138,31,.55)',borderColor:C.or}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw.n}: SR ${f(c.raw.x,1)}, Avg ${f(c.raw.y,1)}, ${c.raw.rn} runs`}}},scales:{x:{title:{display:true,text:'Strike rate'}},y:{title:{display:true,text:'Average'}}}}});
const bb=bat.slice().sort((a,b)=>b.bnd-a.bnd).slice(0,10);
chart('cBnd',{type:'bar',data:{labels:bb.map(p=>p.name),datasets:[{label:'Fours',data:bb.map(p=>p.fours),backgroundColor:C.bl,borderRadius:6},{label:'Sixes',data:bb.map(p=>p.sixes),backgroundColor:C.rd,borderRadius:6}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
const eb=P.filter(p=>p.legalBallsBowled>=6).sort((a,b)=>a.econ-b.econ).slice(0,10);
hbar('cEcon',eb,'econ',C.gr);
const fl=P.filter(p=>p.field>0).sort((a,b)=>b.field-a.field).slice(0,10);
chart('cFld',{type:'bar',data:{labels:fl.map(p=>p.name),datasets:[{label:'Catches',data:fl.map(p=>p.catches),backgroundColor:C.ye,borderRadius:6},{label:'Run outs',data:fl.map(p=>p.runOuts),backgroundColor:C.bl,borderRadius:6},{label:'Stumpings',data:fl.map(p=>p.stumpings),backgroundColor:C.pu,borderRadius:6}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
const t5=bat.slice(0,5),mx=k=>Math.max(1,...P.map(p=>Number.isFinite(p[k])?p[k]:0));
const axes=[['Runs','runsScored'],['Strike rate','sr'],['Average','avg'],['Boundaries','bnd'],['Catches','catches'],['Wickets','wicketsTaken']];
const rc=[C.or,C.pu,C.gr,C.bl,C.rd];
chart('cRad',{type:'radar',data:{labels:axes.map(a=>a[0]),datasets:t5.map((p,i)=>({label:p.name,data:axes.map(([_,k])=>Number.isFinite(p[k])?p[k]/mx(k)*100:0),borderColor:rc[i],backgroundColor:rc[i]+'22',pointBackgroundColor:rc[i]}))},options:{scales:{r:{ticks:{display:false},grid:{color:'rgba(255,255,255,.08)'},angleLines:{color:'rgba(255,255,255,.08)'}}}}});

// Table
const T={
 bat:[['name','Player'],['matchesPlayed','M'],['battingInnings','Inn'],['runsScored','Runs'],['ballsFaced','Balls'],['highestScore','HS'],['avg','Avg',1],['sr','SR',1],['fours','4s'],['sixes','6s'],['fifties','50s'],['notOuts','NO']],
 bowl:[['name','Player'],['matchesPlayed','M'],['bowlingInnings','Inn'],['legalBallsBowled','Overs',0,ov],['runsConceded','Runs'],['wicketsTaken','Wkts'],['best','Best'],['econ','Econ',2],['bavg','Avg',1],['bsr','SR',1],['threeWicketHauls','3W'],['fiveWicketHauls','5W']],
 fld:[['name','Player'],['matchesPlayed','M'],['catches','Catches'],['runOuts','Run outs'],['stumpings','Stumpings'],['field','Total']]};
let tab='bat',sk='runsScored',sd=-1;
function tbl(){
 const cols=T[tab];
 const rows=P.filter(p=>tab==='bat'?p.battingInnings>0:tab==='bowl'?p.bowlingInnings>0:true).sort((a,b)=>{
  const x=a[sk],y=b[sk];if(typeof x==='string'&&typeof y==='string')return sd*x.localeCompare(y)*-1;
  const nx=Number.isFinite(x)?x:(x===Infinity?1e9:-1e9),ny=Number.isFinite(y)?y:(y===Infinity?1e9:-1e9);
  return sd*(ny-nx)*-1;});
 $('#tbl').innerHTML='<thead><tr><th>#</th>'+cols.map(c=>`<th data-k="${c[0]}" class="${c[0]===sk?'on':''}">${c[1]}${c[0]===sk?(sd<0?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead><tbody>'+
 rows.map((p,i)=>`<tr><td class="rk">${i+1}</td>`+cols.map(c=>{let v=p[c[0]];if(c[3])v=c[3](v);else if(c[2]!==undefined&&c[2]!==0)v=v===Infinity?'∞':f(v,c[2]);return `<td class="${c[0]==='name'?'n':''}">${v}</td>`}).join('')+'</tr>').join('')+'</tbody>';
 document.querySelectorAll('#tbl th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sk===k)sd*=-1;else{sk=k;sd=k==='name'?1:-1}tbl()});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;sk={bat:'runsScored',bowl:'wicketsTaken',fld:'field'}[tab];sd=-1;tbl()});
tbl();
}
</script></body></html>
